name: Grow encyclopedia

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ignore_delay:
        description: "Skip grow-not-before.json (local/dev only)"
        type: boolean
        default: false

concurrency:
  group: grow
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Grow until daily hub quota
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'unirepository' }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          GROW_HUBS_PER_DAY: "2"
          GROW_UNTIL_QUOTA: "1"
          GROW_IGNORE_DELAY: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_delay && '1' || '0' }}
        run: npx tsx scripts/grow.ts --until-quota
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No grow changes."
            exit 0
          fi
          DAY=$(date -u +%F)
          BRANCH="grow/${DAY}"
          git checkout -B "$BRANCH"
          git commit -m "Grow encyclopedia ${DAY}"
          git push -u origin "$BRANCH"
          gh pr create --title "Grow ${DAY}" --body "$(cat <<'EOF'
          Daily encyclopedia grow (2 hubs + in-cluster vs that pass uniqueness).

          Do not auto-merge. Review invented-number risk and omitted vs pairs in cluster JSON.

          EOF
          )" || true
