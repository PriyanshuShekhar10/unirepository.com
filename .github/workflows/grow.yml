name: Grow encyclopedia

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: grow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Python for OSM maps
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Grow until daily hub quota
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'unirepository' }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          GROW_HUBS_PER_DAY: "2"
          GROW_UNTIL_QUOTA: "1"
        run: npx tsx scripts/grow.ts --until-quota
      - name: Commit and push to main
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No grow changes."
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAY=$(date -u +%F)
          git commit -m "Grow encyclopedia ${DAY}"
          git push origin HEAD:main
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Build site
        if: steps.commit.outputs.changed == '1'
        run: npm run build
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name unirepository --branch main --commit-dirty=true
